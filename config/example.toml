[session]
max_rounds = 5
veto_seconds = 60
criteria = [
  "technical correctness",
  "internal consistency",
  "missing assumptions",
]

[limits]
minimum_remaining_percent = 20
max_age_seconds = 60

[process]
source_max_bytes = 65536
prompt_max_bytes = 524288
output_max_bytes = 1048576
timeout_seconds = 900

# account_fingerprint: run `docker compose run --rm claude --probe` (or codex) after
# logging in and copy `observed_account_fingerprint`. It is a hash, not a secret.
[reviewers.claude]
model = "PIN_AFTER_LIVE_PREFLIGHT"
# low | medium | high | xhigh | max
effort = "high"
cli_version = "2.1.280"
account_fingerprint = "unconfigured"
model_bucket = "subscription"

[reviewers.codex]
model = "PIN_AFTER_LIVE_PREFLIGHT"
# Allowed values depend on the model: see `supported_reasoning_levels` in `codex debug models`.
effort = "high"
cli_version = "0.156.1"
account_fingerprint = "unconfigured"
model_bucket = "codex"

