[project]
name = "peer-reviewer"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "jsonschema>=4.25,<5",
]

[project.scripts]
peer-reviewer = "peer_reviewer.cli:main"

[dependency-groups]
dev = [
  "pytest>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peer_reviewer"]

[tool.pytest.ini_options]
markers = [
  "live: requires explicitly provisioned real subscription accounts",
  "docker: requires the project's Docker Compose services",
]
